name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: playwright
    # Runs on every PR now. The script picks whichever browser exists (Edge,
    # Chrome, then the bundled Chromium), so the same run works on a laptop and
    # on this runner; Linux only ever takes the last branch.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The app drives playwright-core, which ships no browsers; the CLI of the
      # same version installs the build it expects to find.
      - run: npx --yes playwright@1.64.1 install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: .artifacts/e2e
          if-no-files-found: ignore
